<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Truck Stock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="reynolds_logo_hires_dc44f00b.png" width="120" height="120" alt="" aria-hidden="true">
      <button class="iconbtn back" id="backBtn" type="button" hidden aria-label="Back to all trucks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <img class="avatar" id="pageAvatar" alt="" hidden>
      <svg class="mark" id="pageMark" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      </svg>
      <div>
        <h1 id="pageTitle">Truck Stock</h1>
        <p id="pageSub">Parts and supplies across your trucks.</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="sync" id="sync" data-mode="loading" role="status"><i></i><b id="syncText" style="font-weight:500">Loading</b></span>
      <button class="btn" id="editTruckBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>Truck settings
      </button>
      <button class="btn primary" id="addTruckBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add truck
      </button>
      <button class="btn" id="dataBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13M7 17l-3-3M7 17l3-3M17 20V7M17 7l-3 3M17 7l3 3"></path></svg>Import / export
      </button>
      <button class="btn primary" id="addBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add item
      </button>
    </div>
  </header>

  <div class="stack" id="homeView" hidden></div>

  <div class="stack" id="truckView">
  <div id="banner"></div>
  <section class="health" id="health" aria-label="Truck status"></section>

  <div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" id="tab-stock" data-view="stock" aria-selected="true">Stock</button>
      <button class="tab" role="tab" id="tab-restock" data-view="restock" aria-selected="false">Restock list <span class="count" id="rsCount" hidden></span></button>
    </div>
  </div>

  <div id="stockTools" style="display:flex;flex-direction:column;gap:12px">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Search parts, sizes, bins" autocomplete="off" aria-label="Search stock">
      </div>
      <div class="seg" id="statusSeg" role="group" aria-label="Filter by status">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="low" aria-pressed="false">Low</button>
        <button type="button" data-status="out" aria-pressed="false">Out</button>
      </div>
      <select class="select" id="sort" aria-label="Sort">
        <option value="category">Group by category</option>
        <option value="name">Name A to Z</option>
        <option value="stock">Most urgent first</option>
        <option value="recent">Recently changed</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  </div>

  <main id="main"></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <div class="sheet-h">
      <h2 id="sheetTitle">Add item</h2>
      <button class="iconbtn" type="button" id="closeSheet" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="fields">
      <div class="f"><label for="f-name">Part name</label>
        <div class="combo" id="combo">
          <input id="f-name" role="combobox" aria-expanded="false" aria-controls="partList" aria-autocomplete="list" autocomplete="off" required maxlength="80" placeholder="Pick from the list or type your own">
          <button class="combo-btn" type="button" id="comboBtn" tabindex="-1" aria-label="Show part list">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <ul class="plist" id="partList" role="listbox" aria-label="Common HVAC parts" hidden></ul>
        </div>
      </div>
      <div class="f h"><label for="f-cat">Category</label><select id="f-cat"></select></div>
      <div class="f h" id="gasWrap"><label for="f-gas">Refrigerant</label>
        <select id="f-gas"><option value="">None</option></select></div>
      <div class="f h" id="specWrap"><label for="f-spec">Part number or size</label><input id="f-spec" maxlength="60" placeholder="45/5 µF 440V"></div>
      <div class="f t"><label for="f-qty">On truck</label><input id="f-qty" type="number" inputmode="numeric" min="0" step="1" value="0"></div>
      <div class="f t"><label for="f-min">Restock at</label><input id="f-min" type="number" inputmode="numeric" min="0" step="1" value="1"></div>
      <div class="f t"><label for="f-par">Par level</label><input id="f-par" type="number" inputmode="numeric" min="0" step="1" value="3"></div>
      <div class="f h"><label for="f-unit">Unit</label><input id="f-unit" list="units" maxlength="12" placeholder="ea"><datalist id="units"><option value="ea"><option value="box"><option value="pack"><option value="roll"><option value="ft"><option value="lb"><option value="cyl"><option value="gal"><option value="can"></datalist></div>
      <div class="f h"><label for="f-cost">Cost each (USD)</label><input id="f-cost" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
      <div class="f"><label for="f-loc">Where on the truck</label><input id="f-loc" maxlength="40" placeholder="Driver side bin"></div>
      <p class="hint f" style="grid-column:span 6">Restock at is the count where the item shows as low. Par is the count you refill to.</p>
    </div>
    <div class="sheet-f">
      <div class="grp" id="delGrp"></div>
      <div class="grp"><small id="lastChanged"></small>
        <button class="btn" type="button" id="cancelBtn">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </div>
  </form>
</div>
<div class="scrim" id="truckScrim" hidden>
  <form class="sheet" id="truckForm" role="dialog" aria-modal="true" aria-labelledby="tSheetTitle" novalidate>
    <div class="sheet-h">
      <h2 id="tSheetTitle">Add truck</h2>
      <button class="iconbtn" type="button" id="closeTruck" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="fields">
      <div class="f"><label id="tPhotoLbl">Photo</label>
        <div class="photo-row">
          <span id="tPhotoPrev"></span>
          <div class="grp">
            <button class="btn sm" type="button" id="tPhotoBtn" aria-labelledby="tPhotoLbl tPhotoBtn">Choose photo</button>
            <button class="btn sm" type="button" id="tPhotoClear" hidden>Remove</button>
          </div>
        </div>
        <input type="file" id="tPhotoFile" accept="image/*" hidden>
      </div>
      <div class="f"><label for="t-name">Truck name</label><input id="t-name" required maxlength="60" placeholder="Truck 2"></div>
      <div class="f"><label for="t-note">Tech, plate or van number</label><input id="t-note" maxlength="80" placeholder="Mike, van 14"></div>
      <div class="f" id="tFromWrap"><label for="t-from">Start with</label><select id="t-from"></select></div>
      <label class="chk f" id="tResetWrap" hidden><input type="checkbox" id="t-reset" checked><span>Set all counts to 0<small>Keeps the part list, restock levels and par levels. Turn off to copy the counts too.</small></span></label>
    </div>
    <div class="sheet-f">
      <div class="grp" id="tDelGrp"></div>
      <div class="grp">
        <button class="btn" type="button" id="cancelTruck">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </div>
  </form>
</div>
<div class="scrim" id="dataScrim" hidden>
  <div class="sheet" id="dataSheet" role="dialog" aria-modal="true" aria-labelledby="dataTitle">
    <div class="sheet-h">
      <h2 id="dataTitle">Import / export</h2>
      <button class="iconbtn" type="button" id="closeData" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="dbody" id="dataBody"></div>
    <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var CATS = ['Refrigerant', 'Electrical', 'Motors', 'Filters & Belts', 'Copper & Fittings', 'Controls', 'Consumables'];
  // Standard cylinder colors for common refrigerants
  var GAS = { 'R-410A': '#E7A3B8', 'R-22': '#9ED08B', 'R-134a': '#85C5E8', 'R-404A': '#EC9A4B', 'R-407C': '#B58A63', 'R-454B': '#C9D2DA' };
  var KEY = 'truckstock:v1';

  var DEFAULT_TRUCK = 'truck-1';

  // Pick-list of common parts: name, category, unit, refrigerant, size examples

    ['Copper tubing', 'Copper & Fittings', 'ft', '', '3/8 in, 50 ft coil'],

    ['Brass flare nut', 'Copper & Fittings', 'pack', '', '3/8 in, 10 pack'],
    ['Schrader valve cores', 'Copper & Fittings', 'pack', '', '10 pack'],
    ['Service valve cap', 'Copper & Fittings', 'pack', '', '1/4 in flare'],

    ['Condensate float switch', 'Controls', 'ea', '', 'Overflow, 24V'],
    ['Thermostat wire', 'Controls', 'roll', '', '18/5, 50 ft'],
    ['Pressure switch', 'Controls', 'ea', '', 'Furnace, 0.5 in WC'],
    ['Limit switch', 'Controls', 'ea', '', 'L170-40'],

    ['Flame sensor', 'Controls', 'ea', '', 'Universal'],
    ['Thermistor', 'Controls', 'ea', '', '10K'],
    ['Thermal expansion valve', 'Controls', 'ea', '', '3 ton R-410A'],
    ['Coil cleaner', 'Consumables', 'gal', '', '1 gal concentrate'],

    ['Mastic sealant', 'Consumables', 'gal', '', '1 gal'],
    ['Condensate pan tablets', 'Consumables', 'pack', '', '10 pack'],
    ['Leak sealant', 'Consumables', 'can', '', '4 oz'],
    ['PVC primer and cement', 'Consumables', 'can', '', '8 oz'],
    ['Zip ties', 'Consumables', 'pack', '', '100 pack'],
    ['Electrical tape', 'Consumables', 'roll', '', '3/4 in'],
    ['Duct strap', 'Consumables', 'roll', '', '100 ft']
  ];

  // name, category, part/size, qty, restock-at, par, unit, location, cost, refrigerant
  var STARTER = [
    ['R-410A refrigerant', 'Refrigerant', '25 lb cylinder', 2, 1, 3, 'cyl', 'Rear shelf', 285, 'R-410A'],
    ['R-454B refrigerant', 'Refrigerant', '25 lb cylinder', 1, 1, 2, 'cyl', 'Rear shelf', 310, 'R-454B'],
    ['R-22 reclaimed', 'Refrigerant', '30 lb cylinder', 0, 1, 2, 'cyl', 'Rear shelf', 420, 'R-22'],
    ['R-134a refrigerant', 'Refrigerant', '30 lb cylinder', 1, 0, 1, 'cyl', 'Rear shelf', 160, 'R-134a'],
    ['Dual run capacitor', 'Electrical', '45/5 µF 440V', 4, 2, 6, 'ea', 'Drawer A1', 14, ''],
    ['Dual run capacitor', 'Electrical', '35/5 µF 440V', 1, 2, 6, 'ea', 'Drawer A1', 13, ''],
    ['Dual run capacitor', 'Electrical', '30/5 µF 440V', 3, 2, 5, 'ea', 'Drawer A1', 12, ''],
    ['Contactor, 2 pole', 'Electrical', '30A 24V coil', 3, 2, 5, 'ea', 'Drawer A2', 19, ''],
    ['Hard start kit', 'Electrical', '5-2-1 style', 2, 1, 3, 'ea', 'Drawer A2', 28, ''],
    ['Control transformer', 'Electrical', '40VA 120/240 to 24V', 2, 1, 3, 'ea', 'Drawer A2', 22, ''],
    ['Condenser fan motor', 'Motors', '1/4 HP 825 RPM 208-230V', 1, 1, 2, 'ea', 'Passenger bin', 135, ''],
    ['Blower motor, PSC', 'Motors', '1/3 HP 3-speed 115V', 1, 1, 2, 'ea', 'Passenger bin', 168, ''],
    ['Pleated filter MERV 8', 'Filters & Belts', '16x25x1', 18, 8, 24, 'ea', 'Driver bin 1', 4.5, ''],
    ['Pleated filter MERV 8', 'Filters & Belts', '20x25x1', 14, 8, 24, 'ea', 'Driver bin 1', 5, ''],
    ['Pleated filter MERV 8', 'Filters & Belts', '16x20x1', 6, 6, 18, 'ea', 'Driver bin 1', 4, ''],
    ['V-belt', 'Filters & Belts', 'A42', 2, 1, 3, 'ea', 'Driver bin 2', 11, ''],
    ['Copper line set', 'Copper & Fittings', '3/8 x 3/4 in, 25 ft', 1, 1, 2, 'ea', 'Roof rack', 118, ''],
    ['Silver brazing rods', 'Copper & Fittings', '15% silver, 1 lb', 3, 1, 4, 'lb', 'Driver bin 2', 98, ''],
    ['Brass flare nut', 'Copper & Fittings', '3/8 in, 10 pack', 5, 2, 8, 'pack', 'Drawer B1', 12, ''],
    ['Schrader valve cores', 'Copper & Fittings', '10 pack', 6, 2, 8, 'pack', 'Drawer B1', 7, ''],
    ['Programmable thermostat', 'Controls', '24V, 2H/1C', 2, 1, 3, 'ea', 'Passenger bin', 46, ''],
    ['Condensate float switch', 'Controls', 'Overflow, 24V', 2, 2, 4, 'ea', 'Drawer B2', 17, ''],
    ['Thermostat wire', 'Controls', '18/5, 50 ft', 1, 1, 2, 'roll', 'Drawer B2', 38, ''],
    ['Coil cleaner', 'Consumables', '1 gal concentrate', 2, 1, 3, 'gal', 'Driver bin 2', 24, ''],
    ['Foil tape', 'Consumables', '2.5 in x 60 yd', 6, 2, 8, 'roll', 'Drawer B1', 9, '']
  ];

  var state = {
    items: new Map(), loaded: false, trucks: new Map(), trucksLoaded: false, truckId: null, tEdit: null, tDelete: false,
    tPhoto: '', mode: 'loading', saving: false,
    view: 'stock', q: '', status: 'all', cat: 'all', sort: 'category',
    confirmClear: false, editingId: null, confirmDelete: false, copyText: ''
  };
  var backend = null;
  var pending = new Map();
  var toastTimer = null;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
  function money2(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function ago(ts) {
    if (!ts) return '';
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    return Math.floor(s / 86400) + ' d ago';
  }
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : (d || 0); }

  function norm(id, d) {
    return {
      id: id, name: String(d.name || 'Untitled'), cat: String(d.cat || 'Consumables'), spec: String(d.spec || ''),
      qty: Math.max(0, num(d.qty)), min: Math.max(0, num(d.min)), par: Math.max(0, num(d.par)),
      unit: String(d.unit || ''), loc: String(d.loc || ''), cost: Math.max(0, num(d.cost)),
      gas: String(d.gas || ''), sample: !!d.sample, updatedAt: num(d.updatedAt), truck: String(d.truck || DEFAULT_TRUCK)
    };
  }
  function normTruck(id, d) {
    return { id: id, name: String(d.name || 'Truck'), note: String(d.note || ''), photo: String(d.photo || ''), createdAt: num(d.createdAt) };
  }
  function qtyOf(it) { return pending.has(it.id) ? pending.get(it.id).value : it.qty; }
  function statusOf(it) { var q = qtyOf(it); if (q <= 0) return 'out'; if (q <= it.min) return 'low'; return 'ok'; }
  function everyItem() { return Array.from(state.items.values()); }
  function allItems() { return everyItem().filter(function (it) { return it.truck === state.truckId; }); }
  function truckList() {
    var m = new Map(state.trucks);
    everyItem().forEach(function (it) {
      if (!m.has(it.truck)) m.set(it.truck, { id: it.truck, name: it.truck === DEFAULT_TRUCK ? 'My truck' : 'Truck', note: '', createdAt: 0 });
    });
    return Array.from(m.values()).sort(function (a, b) { return a.createdAt - b.createdAt || a.name.localeCompare(b.name); });
  }
  function getTruck(id) { return truckList().filter(function (t) { return t.id === id; })[0] || null; }
  function needsRestock(it) { return qtyOf(it) <= it.min && it.par > qtyOf(it); }
  function cats() {
    var extra = [];
    allItems().forEach(function (it) { if (CATS.indexOf(it.cat) < 0 && extra.indexOf(it.cat) < 0) extra.push(it.cat); });
    return CATS.concat(extra);
  }

  /* ---------- storage backends ---------- */
  function makeDbBackend(col, tcol) {
    var chain = {};
    function q(id, fn) {
      chain[id] = (chain[id] || Promise.resolve()).catch(function () {}).then(fn);
      return chain[id];
    }
    return {
      set: function (id, data) { return q(id, function () { return col.doc(id).set(data); }); },
      setQty: function (id, qty) { return q(id, function () { return col.doc(id).update({ qty: qty, updatedAt: Date.now() }); }); },
      remove: function (id) { return q(id, function () { return col.doc(id).delete(); }); },
      setTruck: function (id, data) { return q('t:' + id, function () { return tcol.doc(id).set(data); }); },
      removeTruck: function (id) { return q('t:' + id, function () { return tcol.doc(id).delete(); }); }
    };
  }
  function makeLocalBackend() {
    function persist() {
      try { localStorage.setItem(KEY, JSON.stringify(everyItem())); localStorage.setItem(KEY_T, JSON.stringify(Array.from(state.trucks.values()))); } catch (e) {}
    }
    return {
      set: function (id, data) { state.items.set(id, norm(id, data)); persist(); render(); return Promise.resolve(); },
      setQty: function (id, qty) {
        var it = state.items.get(id);
        if (it) { it.qty = qty; it.updatedAt = Date.now(); persist(); render(); }
        return Promise.resolve();
      },
      remove: function (id) { state.items.delete(id); persist(); render(); return Promise.resolve(); },
      setTruck: function (id, data) { state.trucks.set(id, normTruck(id, data)); persist(); render(); return Promise.resolve(); },
      removeTruck: function (id) { state.trucks.delete(id); persist(); render(); return Promise.resolve(); }
    };
  }

  async function boot() {
    render();
    var db = null;
    try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (db) {
      var col = db.collection('items');
      var tcol = db.collection('trucks');
      backend = makeDbBackend(col, tcol);
      state.mode = 'synced';
      col.onSnapshot(function (snap) {
        var m = new Map();
        snap.docs.forEach(function (d) { m.set(d.id, norm(d.id, d.data() || {})); });
        state.items = m; state.loaded = true;
        state.saving = !!(snap.metadata && snap.metadata.hasPendingWrites);
        state.mode = 'synced';
        render();
      }, function () { state.mode = 'offline'; state.loaded = true; render(); });
      tcol.onSnapshot(function (snap) {
        var tm = new Map();
        snap.docs.forEach(function (d) { tm.set(d.id, normTruck(d.id, d.data() || {})); });
        state.trucks = tm; state.trucksLoaded = true; render();
      }, function () { state.trucksLoaded = true; render(); });
    } else {
      backend = makeLocalBackend();
      state.mode = 'local';
      try {
        var raw = JSON.parse(localStorage.getItem(KEY) || '[]');
        raw.forEach(function (d) { state.items.set(d.id, norm(d.id, d)); });
      } catch (e) {}
      try {
        JSON.parse(localStorage.getItem(KEY_T) || '[]').forEach(function (d) { state.trucks.set(d.id, normTruck(d.id, d)); });
      } catch (e) {}
      state.loaded = true; state.trucksLoaded = true;
      render();
    }
  }

  /* ---------- actions ---------- */
  function slug(s) { return (s || 'item').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'item'; }
  function newId(name) { return slug(name) + '-' + Math.random().toString(36).slice(2, 7); }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function failed() { toast('Could not save that change. Check your connection and try again.'); }

  function setQty(id, n) {
    var it = state.items.get(id); if (!it || !backend) return;
    n = Math.max(0, Math.min(9999, Math.round(num(n))));
    var prev = pending.get(id);
    if (prev) clearTimeout(prev.timer);
    var p = { value: n, timer: null };
    p.timer = setTimeout(function () { commitQty(id, p); }, 450);
    pending.set(id, p);
    render();
  }
  function commitQty(id, p) {
    if (pending.get(id) !== p) return;
    backend.setQty(id, p.value).then(function () {
      if (pending.get(id) === p) pending.delete(id);
      render();
    }, function () {
      if (pending.get(id) === p) pending.delete(id);
      failed(); render();
    });
  }

  async function loadStarter() {
    if (!backend) return;
    toast('Adding starter stock');
    try {
      for (var i = 0; i < STARTER.length; i++) {
        var s = STARTER[i];
        await backend.set(newId(s[0]), {
          name: s[0], cat: s[1], spec: s[2], qty: s[3], min: s[4], par: s[5], unit: s[6],
          loc: s[7], cost: s[8], gas: s[9], sample: true, updatedAt: Date.now(), truck: state.truckId
        });
      }
      toast('Starter stock added. Update the counts to match your truck.');
    } catch (e) { failed(); }
  }
  async function clearSamples() {
    var ids = allItems().filter(function (i) { return i.sample; }).map(function (i) { return i.id; });
    state.confirmClear = false;
    try { for (var i = 0; i < ids.length; i++) await backend.remove(ids[i]); toast('Sample items removed'); }
    catch (e) { failed(); }
    render();
  }

  /* ---------- part picker ---------- */
  var combo = { open: false, idx: -1, opts: [] };

  function partPool() {
    var seen = {}, out = [];
    PARTS.forEach(function (p) {
      seen[p[0].toLowerCase()] = 1;
      out.push({ name: p[0], cat: p[1], unit: p[2], gas: p[3], hint: p[4] });
    });
    everyItem().forEach(function (it) {
      var k = it.name.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1;
      out.push({ name: it.name, cat: it.cat, unit: it.unit, gas: it.gas, hint: it.spec });
    });
    return out;
  }
  function renderCombo() {
    var input = $('f-name'), list = $('partList');
    var q = input.value.trim().toLowerCase();
    var order = cats();
    var pool = partPool().filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) >= 0; });
    pool.sort(function (a, b) { return order.indexOf(a.cat) - order.indexOf(b.cat); });
    combo.opts = [];
    var html = '', last = null;
    pool.forEach(function (p) {
      if (p.cat !== last) { html += '<li class="pgroup" role="presentation">' + esc(p.cat) + '</li>'; last = p.cat; }
      html += '<li class="popt" role="option" id="opt-' + combo.opts.length + '" data-i="' + combo.opts.length + '"><span>' + esc(p.name) + '</span>' + (p.hint ? '<small>' + esc(p.hint) + '</small>' : '') + '</li>';
      combo.opts.push(p);
    });
    var exact = pool.some(function (p) { return p.name.toLowerCase() === q; });
    if (q && !exact) {
      html += '<li class="popt pnew" role="option" id="opt-' + combo.opts.length + '" data-i="' + combo.opts.length + '"><span>Use “' + esc(input.value.trim()) + '” as a new part</span></li>';
      combo.opts.push({ name: input.value.trim(), custom: true });
    }
    if (!combo.opts.length) html = '<li class="pgroup" role="presentation">No matches</li>';
    list.innerHTML = html;
    combo.idx = -1;
    input.removeAttribute('aria-activedescendant');
  }
  function openCombo() {
    renderCombo();
    combo.open = true;
    $('partList').hidden = false;
    $('f-name').setAttribute('aria-expanded', 'true');
  }
  function closeCombo() {

    $('partList').hidden = true;
    $('f-name').setAttribute('aria-expanded', 'false');
  }
  function highlight(i, noScroll) {
    var nodes = $('partList').querySelectorAll('.popt');
    if (!nodes.length) return;
    combo.idx = (i + nodes.length) % nodes.length;
    Array.prototype.forEach.call(nodes, function (n, k) { n.classList.toggle('on', k === combo.idx); });
    var cur = nodes[combo.idx];
    $('f-name').setAttribute('aria-activedescendant', cur.id);
    if (!noScroll) cur.scrollIntoView({ block: 'nearest' });
  }
  function pickPart(o) {
    $('f-name').value = o.name;
    if (!o.custom && !state.editingId) {
      if (o.cat) { $('f-cat').value = o.cat; toggleGas(); }
      $('f-gas').value = o.gas || '';

  /* ---------- sheet ---------- */
  function fillCatSelect(sel) {

    $('f-gas').innerHTML = '<option value="">None</option>' + Object.keys(GAS).map(function (g) { return '<option>' + esc(g) + '</option>'; }).join('');

  function toggleGas() { $('gasWrap').hidden = $('f-cat').value !== 'Refrigerant'; }
  function openSheet(id) {
    state.editingId = id || null; state.confirmDelete = false;

    fillCatSelect(it ? it.cat : (state.cat !== 'all' ? state.cat : CATS[0]));
    $('sheetTitle').textContent = it ? 'Edit item' : 'Add item';
    $('f-name').value = it ? it.name : '';
    $('f-spec').value = it ? it.spec : '';
    $('f-gas').value = it ? it.gas : '';
    $('f-qty').value = it ? qtyOf(it) : 0;
    $('f-min').value = it ? it.min : 1;

  function renderDelete() {

  async function saveForm(e) {
    e.preventDefault();

    var min = Math.max(0, Math.round(num($('f-min').value)));

    var data = {

      qty: Math.max(0, Math.round(num($('f-qty').value))), min: min, par: par,
      unit: $('f-unit').value.trim(), loc: $('f-loc').value.trim(),
      cost: Math.max(0, num($('f-cost').value)), sample: false, updatedAt: Date.now(), truck: state.truckId
    };
    var id = state.editingId || newId(name);
    var pend = pending.get(id); if (pend) { clearTimeout(pend.timer); pending.delete(id); }
    closeSheet();

  }

  /* ---------- derived ---------- */
  function visibleItems() {
    var q = state.q.trim().toLowerCase();
    var list = allItems().filter(function (it) {
      if (state.cat !== 'all' && it.cat !== state.cat) return false;
      if (state.status !== 'all' && statusOf(it) !== state.status) return false;
      if (state.status === 'low' && statusOf(it) !== 'low') return false;
      if (q) {
        var hay = (it.name + ' ' + it.spec + ' ' + it.loc + ' ' + it.gas + ' ' + it.cat).toLowerCase();
        return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
      }
      return true;
    });
    var byName = function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }) || a.spec.localeCompare(b.spec, undefined, { numeric: true }); };
    var rank = { out: 0, low: 1, ok: 2 };
    if (state.sort === 'name' || state.sort === 'category') list.sort(byName);
    else if (state.sort === 'recent') list.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    else list.sort(function (a, b) {
      var ra = rank[statusOf(a)], rb = rank[statusOf(b)];
      if (ra !== rb) return ra - rb;
      return (qtyOf(a) / Math.max(a.par, 1)) - (qtyOf(b) / Math.max(b.par, 1)) || byName(a, b);
    });
    return list;
  }

  };

  function renderSync() {
    var s = $('sync'); s.setAttribute('data-mode', state.mode);

      (state.confirmClear

      '</div></div>';
  }

  function renderHealth() {
    var items = allItems(), n = items.length;
    var c = { ok: 0, low: 0, out: 0 }, units = 0, value = 0;
    items.forEach(function (it) { c[statusOf(it)]++; units += qtyOf(it); value += qtyOf(it) * it.cost; });
    var need = c.low + c.out, title;
    if (!state.loaded) title = 'Checking the truck';
    else if (!n) title = 'The truck is empty';
    else if (!need) title = 'Everything is stocked';

      '<dl class="stats"><div><dt>Items</dt><dd>' + n + '</dd></div><div><dt>Units on hand</dt><dd>' + units.toLocaleString('en-US') + '</dd></div><div><dt>Stock value</dt><dd>' + money(value) + '</dd></div></dl>';

  function renderChips() {

  function rowHtml(it) {

      '<div class="gauge"><div class="track"><div class="fill" data-s="' + st + '" style="width:' + fill + '%"></div>' + (it.min > 0 ? '<div class="tick" style="left:calc(' + tick + '% - 1px)"></div>' : '') + '</div>' +
      '<div class="gl"><span>Restock at ' + it.min + '</span><span>Par ' + it.par + (it.unit ? ' ' + esc(it.unit) : '') + '</span></div></div>' +

      '<input class="qty" type="number" inputmode="numeric" min="0" max="9999" value="' + q + '" aria-label="Quantity of ' + esc(it.name) + (it.spec ? ' ' + esc(it.spec) : '') + '">' +

  function unitsOf(arr) { return arr.reduce(function (s, i) { return s + qtyOf(i); }, 0).toLocaleString('en-US'); }

  function restockLines() {

  function restockText(lines) {

  /* ---------- truck photos ---------- */
  var TRUCK_GLYPH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16.5V7a1 1 0 0 1 1-1h9v10.5M13 9.5h4l3 3.5v3.5h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="16.5" cy="17.5" r="1.8"></circle></svg>';

  function resizePhoto(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var side = Math.min(img.width, img.height), size = 192, c = document.createElement('canvas');
        c.width = c.height = size;

      function cell(field) { return map[field] == null ? '' : clean(r[map[field]]); }
      var name = cell('name');
      if (!name) { skipped.push('Row ' + line + ': no part name'); return; }
      out.push({
        name: name.slice(0, 80), cat: cell('cat'), spec: cell('spec').slice(0, 60),
        qty: pnum(cell('qty')), min: pnum(cell('min')), par: pnum(cell('par')),
        unit: cell('unit').slice(0, 12), loc: cell('loc').slice(0, 40), cost: pnum(cell('cost')), gas: cell('gas')
      });
    });
    var extra = rows.length - 1 > 1000 ? rows.length - 1001 : 0;
    if (extra) skipped.push(extra + ' rows past the first 1,000 were left out');
    return { rows: out, skipped: skipped, total: Math.min(rows.length - 1, 1000), columns: Object.keys(map) };
  }

  function buildPlan(parsed) {
    var existing = allItems().filter(function (it) { return !(impOpts.clearSamples && it.sample); });
    var byKey = {};
    existing.forEach(function (it) { byKey[keyOf(it.name, it.spec)] = it; });
    var seen = {}, uniq = [], dups = 0;
    parsed.rows.forEach(function (r) {
      var k = keyOf(r.name, r.spec);
      if (seen[k] != null) { uniq[seen[k]] = r; dups++; return; }
      seen[k] = uniq.length; uniq.push(r);
    });
    var plan = { add: [], upd: [], keep: 0, dups: dups };
    uniq.forEach(function (r) {
      var m = byKey[keyOf(r.name, r.spec)];
      if (!m) plan.add.push(r);
      else if (impOpts.updateMatches) plan.upd.push({ r: r, m: m });
      else plan.keep++;
    });
    return plan;
  }
  function whole(n, d) { return n == null ? d : Math.max(0, Math.round(n)); }
  function newData(r) {
    var min = whole(r.min, 1), par = Math.max(min, whole(r.par, Math.max(3, min)));
    return {
      name: r.name, cat: matchCat(r.cat), spec: r.spec, gas: matchGas(r.gas), qty: whole(r.qty, 0), min: min, par: par,
      unit: r.unit, loc: r.loc, cost: r.cost == null ? 0 : Math.max(0, r.cost), sample: false, updatedAt: Date.now(), truck: state.truckId
    };
  }
  function updatedData(m, r) {
    var d = {
      name: m.name, cat: m.cat, spec: m.spec, gas: m.gas, qty: qtyOf(m), min: m.min, par: m.par,
      unit: m.unit, loc: m.loc, cost: m.cost, sample: false, updatedAt: Date.now(), truck: m.truck
    };
    if (r.cat) d.cat = matchCat(r.cat);
    if (r.gas) d.gas = matchGas(r.gas);
    if (r.unit) d.unit = r.unit;
    if (r.loc) d.loc = r.loc;
    if (r.cost != null) d.cost = Math.max(0, r.cost);
    if (r.min != null) d.min = whole(r.min, d.min);
    if (r.par != null) d.par = whole(r.par, d.par);
    if (impOpts.overwriteQty && r.qty != null) d.qty = whole(r.qty, d.qty);
    d.par = Math.max(d.par, d.min);
    return d;
  }

  async function applyImport() {
    if (!imp || !imp.parsed || !backend) return;
    var plan = buildPlan(imp.parsed);
    var removeIds = impOpts.clearSamples ? allItems().filter(function (i) { return i.sample; }).map(function (i) { return i.id; }) : [];
    var total = plan.add.length + plan.upd.length;
    closeData();
    toast('Importing ' + total + ' items');
    try {
      for (var i = 0; i < removeIds.length; i++) await backend.remove(removeIds[i]);
      for (var j = 0; j < plan.upd.length; j++) await backend.set(plan.upd[j].m.id, updatedData(plan.upd[j].m, plan.upd[j].r));
      for (var k = 0; k < plan.add.length; k++) await backend.set(newId(plan.add[k].name), newData(plan.add[k]));
      toast('Imported ' + plan.add.length + ' new, updated ' + plan.upd.length);
    } catch (e) { failed(); }
  }

  function readFile(file) {
    if (!file) return;
    var done = function (text) {
      var parsed = parseImport(text);
      imp = parsed.error ? { fileName: file.name, error: parsed.error } : { fileName: file.name, parsed: parsed };
      renderData();
    };
    if (file.text) file.text().then(done, function () { imp = { fileName: file.name, error: 'Could not read that file.' }; renderData(); });
    else {
      var fr = new FileReader();
      fr.onload = function () { done(String(fr.result || '')); };
      fr.onerror = function () { imp = { fileName: file.name, error: 'Could not read that file.' }; renderData(); };
      fr.readAsText(file);
    }
  }

  function chk(id, label, on, hint) {
    return '<label class="chk"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span>' + label + (hint ? '<small>' + hint + '</small>' : '') + '</span></label>';
  }
  function renderData() {
    var h = '';
    h += '<section class="dsec"><h3>Export</h3><p>Save this truck’s stock as a CSV file for Excel or Google Sheets.</p>' +
      '<div class="dacts"><button class="btn" type="button" data-d="export">Export stock</button></div>' +
      '<p class="hint">Counts are saved exactly as they are now. To set up another truck, use Add truck on the home page, or import this file there. <button class="linkbtn" type="button" data-d="blank">Blank template with examples</button></p></section>';
    h += '<section class="dsec" id="dropzone"><h3>Import</h3><p>Choose a CSV with the same columns as an export. New parts are added to this truck, and parts that match by name and size are updated.</p>' +
      '<div class="dacts"><button class="btn primary" type="button" data-d="choose">Choose CSV file</button></div>';
    if (imp && imp.error) h += '<p class="derr" role="alert">' + esc(imp.error) + '</p>';
    if (imp && imp.parsed) {
      var plan = buildPlan(imp.parsed), p = imp.parsed;
      var samples = allItems().filter(function (i) { return i.sample; }).length;
      var n = plan.add.length + plan.upd.length;
      h += '<div class="dprev"><p><b>' + esc(imp.fileName) + '</b> has ' + p.total + (p.total === 1 ? ' row' : ' rows') + '.</p><ul class="dstat">' +
        '<li><b>' + plan.add.length + '</b> new</li>' +
        '<li><b>' + plan.upd.length + '</b> updated</li>' +
        (plan.keep ? '<li><b>' + plan.keep + '</b> left as is</li>' : '') +
        (plan.dups ? '<li><b>' + plan.dups + '</b> repeated rows merged</li>' : '') +
        (p.skipped.length ? '<li class="bad"><b>' + p.skipped.length + '</b> skipped</li>' : '') + '</ul>';
      h += '<div class="dopts">' +
        chk('opt-upd', 'Update parts that already match', impOpts.updateMatches, 'Same name and size. Changes category, unit, location, cost, restock and par levels.') +
        chk('opt-qty', 'Also replace counts on hand', impOpts.overwriteQty, 'Leave off to keep this truck’s current counts.') +
        (samples ? chk('opt-clr', 'Remove the ' + samples + ' sample items first', impOpts.clearSamples, '') : '') + '</div>';
      if (p.skipped.length) h += '<ul class="dskip">' + p.skipped.slice(0, 5).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
      h += '<div class="dacts"><button class="btn primary" type="button" data-d="apply"' + (n ? '' : ' disabled') + '>Import ' + n + (n === 1 ? ' item' : ' items') + '</button><button class="btn" type="button" data-d="cancel">Cancel</button></div></div>';
    }
    h += '</section>';
    if (csvText) h += '<section class="dsec"><h3>Copy this file</h3><p>Saving a file isn’t available here. Select all, copy, and paste into a text file ending in .csv.</p><textarea class="copybox" id="csvbox" readonly aria-label="CSV text">' + esc(csvText) + '</textarea></section>';
    $('dataBody').innerHTML = h;
    if (csvText) { var b = $('csvbox'); if (b) { b.focus(); b.select(); } }
  }
  function openData() { imp = null; csvText = ''; renderData(); $('dataScrim').hidden = false; }
  function closeData() { $('dataScrim').hidden = true; imp = null; csvText = ''; }

  $('dataBtn').addEventListener('click', openData);
  $('closeData').addEventListener('click', closeData);
  $('dataScrim').addEventListener('mousedown', function (e) { if (e.target === $('dataScrim')) closeData(); });
  $('csvFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; readFile(f); e.target.value = '';
  });
  $('dataBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-d]'); if (!b) return;
    var a = b.getAttribute('data-d');
    var now = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var stamp = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    var tr = getTruck(state.truckId), tslug = slug(tr ? tr.name : 'truck');
    if (a === 'export') saveFile('truck-stock-' + tslug + '-' + stamp + '.csv', buildCsv());
    else if (a === 'blank') saveFile('truck-stock-blank-template.csv', buildBlankCsv());
    else if (a === 'choose') $('csvFile').click();
    else if (a === 'apply') applyImport();
    else if (a === 'cancel') { imp = null; renderData(); }
  });
  $('dataBody').addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'opt-upd') impOpts.updateMatches = e.target.checked;
    else if (id === 'opt-qty') impOpts.overwriteQty = e.target.checked;
    else if (id === 'opt-clr') impOpts.clearSamples = e.target.checked;
    else return;
    renderData();
    var again = $(id); if (again) again.focus();
  });
  $('dataBody').addEventListener('dragover', function (e) { e.preventDefault(); });
  $('dataBody').addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; readFile(f);
  });

  async function copyList() {
    var text = restockText(restockLines());
    try {
      await navigator.clipboard.writeText(text);
      toast('Restock list copied');
    } catch (e) {
      state.copyText = text; render(); toast('Select the text below and copy it');
    }
  }

  boot();
})();
</script>

</body></html>
